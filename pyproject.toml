[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "lupaxa-githooks-pre-commit-template"
version = "0.0.0"
description = "One Git pre-commit hook script you copy and configure."
readme = "README.md"
requires-python = ">=3.13"

authors = [
  { name = "The Lupaxa Project" }
]

keywords = ["git", "hooks", "pre-commit"]

dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6.0",
  "mypy>=1.12.0",
  "bump-my-version>=1.2.0",
  "mkdocs==1.6.1",
  "mkdocs-material==9.7.7",
]
test = [
  "pytest>=8.0",
]

[tool.hatch.build.targets.wheel]
bypass-selection = true

[tool.ruff]
line-length = 100
target-version = "py313"
extend-include = ["src/pre-commit-template"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "S", "UP", "SIM", "C4", "ISC"]
ignore = ["ISC001"]

[tool.ruff.lint.per-file-ignores]
"src/pre-commit-template" = ["S"]
"tests/*" = ["S"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.13"
warn_unused_configs = true
disallow_untyped_defs = true
follow_imports = "normal"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pytest.ini_options]
addopts = "-ra -q --disable-warnings"
testpaths = ["tests"]
